<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血壓管理App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❤️ 血壓管理App</h1>
            <p>紀錄並追蹤您的血壓數據</p>
        </div>

        <div class="main-content">
            <!-- 表單區域 -->
            <div class="card form-section">
                <h2>📋 新增記錄</h2>
                <div class="success-message" id="successMessage">記錄已成功新增！</div>

                <form id="bloodPressureForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="systolic">收縮壓 (mmHg)</label>
                            <input type="number" id="systolic" name="systolic" min="0" max="300" placeholder="例如：120" required>
                        </div>
                        <div class="form-group">
                            <label for="diastolic">舒張壓 (mmHg)</label>
                            <input type="number" id="diastolic" name="diastolic" min="0" max="200" placeholder="例如：80" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="pulse">脈搏 (次/分)</label>
                        <input type="number" id="pulse" name="pulse" min="0" max="300" placeholder="例如：75" required>
                    </div>

                    <div class="form-group">
                        <label for="medication">是否使用藥物治療</label>
                        <select id="medication" name="medication" required>
                            <option value="">-- 請選擇 --</option>
                            <option value="none">無</option>
                            <option value="yes">已服藥</option>
                            <option value="no">未服藥</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="notes">備註</label>
                        <textarea id="notes" name="notes" placeholder="例如：早上測量、運動後、感覺不適..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-submit">✓ 新增記錄</button>
                        <button type="reset" class="btn-reset">✕ 清除</button>
                    </div>
                </form>
            </div>

            <!-- 記錄清單區域 -->
            <div class="card list-section">
                <h2>📊 血壓紀錄</h2>
                <div class="records-list" id="recordsList">
                    <div class="empty-message">還沒有任何記錄，開始新增吧！</div>
                </div>
                <button class="clear-all-btn" id="clearAllBtn" style="display: none;">🗑️ 清除所有記錄</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
